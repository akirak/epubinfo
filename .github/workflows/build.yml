name: Build executable
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  pull_request:
    paths-ignore:
    - '**.md'
  push:
    branches:
    - master
    paths:
    - flake.nix
    - flake.lock
    - '**/*.hs'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    strategy:
      matrix:
        platform:
          - ubuntu-latest
          - macos-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
      # Explicitly check out a branch if called by a workflow_call event.
      # Otherwise, check out the default branch.
        ref: ${{ inputs.ref }}
        persist-credentials: false
    - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
    - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
      with:
        name: akirak
        skipPush: ${{ github.ref_name != 'master' }}
        signingKey: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: Print the GHC version
      run: nix eval .#epubinfo.compiler.version
    - run: nix build
